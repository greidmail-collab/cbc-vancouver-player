<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8"><meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="CBC 690">

<title>CBC Radio One Vancouver</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        min-height: 100%;
        margin: 0;
    }

    body {
        min-height: 100vh;
        min-height: 100dvh;

        display: flex;
        justify-content: center;
        align-items: center;

        padding:
            env(safe-area-inset-top)
            20px
            env(safe-area-inset-bottom);

        background:
            radial-gradient(
                circle at top,
                #3b1418 0%,
                #181818 45%,
                #070707 100%
            );

        color: white;
        font-family: Arial, Helvetica, sans-serif;
        text-align: center;
    }

    .player {
        width: 100%;
        max-width: 500px;
        padding: 25px;
    }

    .radio-icon {
        width: 150px;
        height: 150px;
        margin: 0 auto 25px;

        border-radius: 28px;

        display: flex;
        justify-content: center;
        align-items: center;

        background: #c90016;

        font-size: 40px;
        font-weight: bold;

        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.45);
    }

    h1 {
        margin: 0;
        font-size: 30px;
        line-height: 1.2;
    }

    .station {
        margin-top: 10px;
        color: #d3d3d3;
        font-size: 19px;
    }

    .status {
        min-height: 26px;
        margin: 28px 0 18px;

        color: #eeeeee;
        font-size: 17px;
    }

    .play-button {
        width: min(280px, 72vw);
        height: min(280px, 72vw);

        border: none;
        border-radius: 50%;

        display: inline-flex;
        justify-content: center;
        align-items: center;

        padding: 0;

        background: #c90016;
        color: white;

        cursor: pointer;

        box-shadow:
            0 14px 38px rgba(0, 0, 0, 0.5),
            inset 0 2px 3px rgba(255, 255, 255, 0.25);

        transition:
            transform 0.12s ease,
            box-shadow 0.12s ease;

        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
    }

    .play-button:active {
        transform: scale(0.96);

        box-shadow:
            0 7px 20px rgba(0, 0, 0, 0.55),
            inset 0 2px 3px rgba(255, 255, 255, 0.2);
    }

    .play-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .play-symbol {
        width: 0;
        height: 0;

        margin-left: 24px;

        border-top: 58px solid transparent;
        border-bottom: 58px solid transparent;
        border-left: 92px solid white;
    }

    .pause-symbol {
        display: flex;
        gap: 30px;
    }

    .pause-symbol span {
        display: block;
        width: 35px;
        height: 115px;
        border-radius: 6px;
        background: white;
    }

    audio {
        display: none;
    }

    @media (max-height: 700px) {
        .radio-icon {
            width: 110px;
            height: 110px;
            margin-bottom: 15px;
            font-size: 31px;
        }

        h1 {
            font-size: 25px;
        }

        .status {
            margin: 17px 0 13px;
        }

        .play-button {
            width: min(225px, 60vw);
            height: min(225px, 60vw);
        }
    }
</style>

</head><body>
    <main class="player">
        <div class="radio-icon">690</div>    <h1>CBC Radio One</h1>
    <div class="station">Vancouver · 690 AM</div>

    <div id="status" class="status">
        Tap Play to listen
    </div>

    <button
        id="playButton"
        class="play-button"
        type="button"
        aria-label="Play CBC Radio One Vancouver"
    >
        <span class="play-symbol" aria-hidden="true"></span>
    </button>

    <audio
        id="radio"
        preload="none"
        playsinline
    ></audio>
</main>

<!--
    HLS playback library for browsers that do not provide
    suitable native HLS playback.
-->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.14"></script>

<script>
    "use strict";

    const streamUrl =
        "https://cbcradiolive.akamaized.net/hls/live/2041050/ES_R1PVC/master.m3u8";

    const radio = document.getElementById("radio");
    const playButton = document.getElementById("playButton");
    const statusText = document.getElementById("status");

    let hls = null;
    let playerReady = false;
    let userRequestedPlayback = false;

    function displayPlayButton() {
        playButton.innerHTML =
            '<span class="play-symbol" aria-hidden="true"></span>';

        playButton.setAttribute(
            "aria-label",
            "Play CBC Radio One Vancouver"
        );
    }

    function displayPauseButton() {
        playButton.innerHTML =
            '<span class="pause-symbol" aria-hidden="true">' +
                "<span></span>" +
                "<span></span>" +
            "</span>";

        playButton.setAttribute(
            "aria-label",
            "Pause CBC Radio One Vancouver"
        );
    }

    function showPaused(message = "Tap Play to listen") {
        displayPlayButton();
        statusText.textContent = message;
    }

    function showPlaying() {
        displayPauseButton();
        statusText.textContent = "Playing live";
    }

    function initializePlayer() {
        /*
            Use hls.js when the browser supports MediaSource.
            This generally covers Chrome, Edge and many Android
            browsers.
        */
        if (window.Hls && Hls.isSupported()) {
            hls = new Hls({
                enableWorker: true,
                lowLatencyMode: false,
                backBufferLength: 30
            });

            hls.loadSource(streamUrl);
            hls.attachMedia(radio);

            hls.on(Hls.Events.MANIFEST_PARSED, function () {
                playerReady = true;
            });

            hls.on(Hls.Events.ERROR, function (event, data) {
                console.error("HLS error:", data);

                if (!data.fatal) {
                    return;
                }

                if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                    statusText.textContent = "Reconnecting…";
                    hls.startLoad();
                    return;
                }

                if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                    statusText.textContent = "Recovering audio…";
                    hls.recoverMediaError();
                    return;
                }

                statusText.textContent = "Stream unavailable";
                playButton.disabled = true;
                hls.destroy();
            });

            return;
        }

        /*
            iPhone and iPad Safari provide native HLS playback.
        */
        if (
            radio.canPlayType("application/vnd.apple.mpegurl") ||
            radio.canPlayType("application/x-mpegURL")
        ) {
            radio.src = streamUrl;
            playerReady = true;
            return;
        }

        statusText.textContent =
            "This browser cannot play the station";

        playButton.disabled = true;
    }

    async function playRadio() {
        userRequestedPlayback = true;
        statusText.textContent = "Connecting…";

        try {
            /*
                Reloading the live playlist after a long pause helps
                playback resume near the current live position.
            */
            if (hls && playerReady) {
                hls.startLoad(-1);
            }

            await radio.play();
        } catch (error) {
            console.error("Playback could not begin:", error);
            userRequestedPlayback = false;
            showPaused("Unable to start the stream");
        }
    }

    function pauseRadio() {
        userRequestedPlayback = false;
        radio.pause();

        if (hls) {
            hls.stopLoad();
        }

        showPaused();
    }

    playButton.addEventListener("click", function () {
        if (radio.paused) {
            playRadio();
        } else {
            pauseRadio();
        }
    });

    radio.addEventListener("playing", function () {
        showPlaying();
    });

    radio.addEventListener("waiting", function () {
        if (userRequestedPlayback) {
            statusText.textContent = "Buffering…";
        }
    });

    radio.addEventListener("stalled", function () {
        if (userRequestedPlayback) {
            statusText.textContent = "Reconnecting…";
        }
    });

    radio.addEventListener("pause", function () {
        if (!userRequestedPlayback) {
            showPaused();
        }
    });

    radio.addEventListener("error", function () {
        /*
            hls.js handles its own errors. This section handles
            native HLS errors on devices such as an iPhone.
        */
        if (!hls) {
            userRequestedPlayback = false;
            showPaused("Stream unavailable");
        }
    });

    initializePlayer();
</script>

</body>
</html>
